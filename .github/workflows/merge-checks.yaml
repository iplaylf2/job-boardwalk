name: Merge checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          rustfmt --version

      - name: Cache Cargo dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: workspace

      - name: Set up Rust compilation cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Read cargo-binstall version
        id: cargo_binstall
        shell: bash
        run: |
          version=$(sed -n 's/^  binstallVersion: "\([^"]*\)"$/\1/p' .moon/toolchains.yml)
          if [[ -z "$version" ]]; then
            echo "Could not read rust.binstallVersion from .moon/toolchains.yml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0
        with:
          version: ${{ steps.cargo_binstall.outputs.version }}

      - name: Install Slint Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust dependency advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec moon run cargo-workspace:advisories

      - name: Run repository checks
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: pnpm exec moon exec --plan .moon/ci.json
