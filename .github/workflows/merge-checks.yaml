name: Merge checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          rustfmt --version

      - name: Install Slint Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust dependency advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec moon run cargo-workspace:advisories

      - name: Run repository checks
        run: pnpm exec moon exec --plan .moon/ci.json
