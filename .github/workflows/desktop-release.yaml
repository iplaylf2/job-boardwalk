name: Desktop release

on:
  push:
    branches:
      - master
    paths:
      - internal/desktop-distribution/package.json

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  resolve:
    name: Resolve desktop release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      required: ${{ steps.resolve.outputs.required }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve desktop release
        id: resolve
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          package_manifest=internal/desktop-distribution/package.json
          product_version="$(jq --raw-output '.version // empty' "$package_manifest")"
          if [ -z "$product_version" ]; then
            echo "Desktop product version is missing." >&2
            exit 1
          fi

          before_version="$(git show "$BEFORE_SHA:$package_manifest" | jq --raw-output '.version // empty')"
          if [ "$before_version" = "$product_version" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent_version="$(git show "$GITHUB_SHA^1:$package_manifest" | jq --raw-output '.version // empty')"
          if [ "$parent_version" = "$product_version" ]; then
            echo "Desktop version $product_version was introduced before the push tip." >&2
            echo "The version-introducing commit must reach master as the push tip so release provenance identifies exactly that source." >&2
            exit 1
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$product_version" >> "$GITHUB_OUTPUT"
          echo "version=$product_version" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-24.04
            archive_path: target/desktop-distribution/releases/*.tar.gz
          - platform: Windows x64
            runner: windows-2025
            archive_path: target/desktop-distribution/releases/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3
          enable_aqua_install: false
          working_directory: internal/desktop-distribution

      - name: Prepare pinned release inputs
        run: pnpm --filter @job-boardwalk/desktop-distribution run prepare-release-inputs

      - name: Build portable archive
        shell: pwsh
        run: |
          $env:JOB_BOARDWALK_DESKTOP_CADDY_EXECUTABLE = aqua which --config internal/desktop-distribution/aqua.yaml caddy
          pnpm exec moon exec --ignore-ci-checks desktop-distribution:package

      - name: Attest portable archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.archive_path }}
          subject-version: ${{ needs.resolve.outputs.version }}

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          # Direct uploads use archive filenames as artifact names.
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

  publish:
    name: Publish GitHub prerelease
    needs:
      - resolve
      - package
    if: needs.resolve.outputs.required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_ARTIFACT_PATTERN: job-boardwalk-${{ needs.resolve.outputs.version }}-*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download portable archives
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.RELEASE_ARTIFACT_PATTERN }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Create release notes
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' internal/desktop-distribution/CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create release checksums
        shell: bash
        run: |
          (
            cd release-assets
            shopt -s nullglob
            release_archives=(*)
            if (( ${#release_archives[@]} == 0 )); then
              echo "No desktop release artifacts matched $RELEASE_ARTIFACT_PATTERN." >&2
              exit 1
            fi
            for archive in "${release_archives[@]}"; do
              if [[ ! -f "$archive" ]]; then
                echo "Downloaded desktop release artifact is not a regular file: $archive" >&2
                exit 1
              fi
            done
            sha256sum -- "${release_archives[@]}" > SHA256SUMS
          )

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          shopt -s nullglob
          release_assets=(release-assets/*)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No desktop release assets are available to publish." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "GitHub release $RELEASE_TAG already exists and is not a draft; refusing to replace it." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "Job Boardwalk $RELEASE_VERSION" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Job Boardwalk $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
