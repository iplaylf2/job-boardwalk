name: Desktop release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing desktop product version to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changesets:
    name: Maintain version pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      has_changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || github.token }}
          version-script: pnpm exec changeset version
          commit-message: "chore: version desktop product"
          pr-title: "chore: version desktop product"
          pr-base-branch: master

  release:
    name: Select desktop release
    needs: changesets
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changesets.outputs.has_changesets == 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      required: ${{ steps.detect.outputs.required }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select desktop product version
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_EVENT: ${{ github.event_name }}
          RETRY_VERSION: ${{ inputs.release_version }}
        run: |
          package_manifest=internal/desktop-distribution/package.json
          product_version="$(jq --raw-output '.version // empty' "$package_manifest")"
          if [ -z "$product_version" ]; then
            echo "Desktop product version is missing." >&2
            exit 1
          fi
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "Desktop release retries must run from master." >&2
              exit 1
            fi
            if [ "$product_version" != "$RETRY_VERSION" ]; then
              echo "Requested desktop version $RETRY_VERSION does not match manifest version $product_version." >&2
              exit 1
            fi
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$product_version" >> "$GITHUB_OUTPUT"
            echo "version=$product_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_package_manifest="$RUNNER_TEMP/previous-desktop-distribution-package.json"
          git show "$BEFORE_SHA:$package_manifest" > "$previous_package_manifest"
          previous_product_version="$(jq --raw-output '.version // empty' "$previous_package_manifest")"
          echo "required=false" >> "$GITHUB_OUTPUT"
          if [ "$previous_product_version" = "$product_version" ]; then
            exit 0
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$product_version" >> "$GITHUB_OUTPUT"
          echo "version=$product_version" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-24.04
            archive_path: target/desktop-distribution/releases/*.tar.gz
          - platform: Windows x64
            runner: windows-2025
            archive_path: target/desktop-distribution/releases/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Set up Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3
          enable_aqua_install: false
          working_directory: internal/desktop-distribution

      - name: Prepare pinned release inputs
        run: pnpm --filter @job-boardwalk/desktop-distribution run prepare-release-inputs

      - name: Build portable archive
        shell: pwsh
        run: |
          $env:JOB_BOARDWALK_DESKTOP_CADDY_EXECUTABLE = aqua which --config internal/desktop-distribution/aqua.yaml caddy
          pnpm exec moon exec --ignore-ci-checks desktop-distribution:package

      - name: Attest portable archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.archive_path }}
          subject-version: ${{ needs.release.outputs.version }}

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 7
          archive: false

  publish:
    name: Publish GitHub prerelease
    needs:
      - release
      - package
    if: needs.release.outputs.required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download portable archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release notes
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' internal/desktop-distribution/CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create release checksums
        shell: bash
        run: |
          (
            cd release-assets
            sha256sum -- *.tar.gz *.zip > SHA256SUMS
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is not a draft." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "Job Boardwalk $RELEASE_VERSION" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Job Boardwalk $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
