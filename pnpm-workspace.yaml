packages:
  - apps/*
  - packages/*
  - internal/*

nodeVersion: 26.7.0
engineStrict: true
injectWorkspacePackages: true

strictPeerDependencies: true

# Temporary: dependency-cruiser 18.1 cannot analyze the workspace's TypeScript version.
# Remove this extension once the installed dependency-cruiser supports the catalog's
# TypeScript version, then verify `pnpm exec moon run repository:boundaries` cruises TypeScript
# modules rather than 0.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: 6.0.3

# External packages used by two or more workspace manifests belong in this catalog and use
# `catalog:`. A package used by one manifest keeps its version there; workspace packages use
# `workspace:*`.
catalog:
  "@hono/node-server": 2.1.0
  "@modelcontextprotocol/sdk": ^1.30.0
  "@shajara/host": ^0.11.0
  "@types/node": ^26.2.0
  arktype: ^2.2.3
  hono: 4.13.1
  oxlint: ^1.78.0
  tsx: ^4.23.12
  typescript: ^7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10

catalogMode: prefer
cleanupUnusedCatalogs: true

allowBuilds:
  "@pnpm/exe": true
  esbuild: true
  oxfmt: true
  oxlint: true

minimumReleaseAge: 0
