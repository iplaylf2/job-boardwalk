packages:
  - apps/*
  - packages/*
  - internal/*

nodeVersion: 26.8.1
engineStrict: true
injectWorkspacePackages: true

strictPeerDependencies: true

# Temporary: dependency-cruiser 18.2 cannot analyze the workspace's TypeScript version.
# Remove this extension once the installed dependency-cruiser supports the catalog's
# TypeScript version, then verify `pnpm exec moon run repository:boundaries` cruises TypeScript
# modules rather than 0.
packageExtensions:
  dependency-cruiser@18:
    dependencies:
      typescript: ^6.0.3

# External packages used by two or more workspace manifests belong in this catalog and use
# `catalog:`. A package used by one manifest keeps its version there; workspace packages use
# `workspace:*`.
catalog:
  "@hono/node-server": ^2.1.1
  "@modelcontextprotocol/sdk": ^1.30.0
  "@shajara/host": ^0.11.0
  "@types/node": ^26.5.0
  arktype: ^2.2.3
  hono: ^4.13.7
  oxlint: ^1.82.0
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^5.0.0

catalogMode: prefer
cleanupUnusedCatalogs: true

allowBuilds:
  "@pnpm/exe": true
  esbuild: true
  oxfmt: true
  oxlint: true

minimumReleaseAge: 0

# Browser Session owns the rationale and removal criteria:
# apps/browser-session/README.md#demand-driven-request-interception
patchedDependencies:
  patchright-core@1.62.3: patches/patchright-core@1.62.3.patch
