[workspace]
members = ["apps/desktop-manager"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
slint = { version = "1.17.1", default-features = false, features = [
  "accessibility",
  "backend-winit",
  "compat-1-2",
  "renderer-femtovg",
  "renderer-software",
  "std",
] }
slint-build = "1.17.1"
ureq = { version = "3.4.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
