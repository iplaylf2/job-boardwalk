language: "typescript"
layer: "library"
stack: "backend"

tasks:
  lint:
    command: "pnpm run lint"
    inputs:
      - "oxlint.config.ts"
      - "src/**/*"
      - "test/**/*"

  test:
    command: "pnpm run test"
    deps:
      - "~:typecheck"
    inputs:
      - "package.json"
      - "src/**/*"
      - "test/**/*"
      - "vitest.config.ts"

  typecheck:
    command: "pnpm run typecheck"
    inputs:
      - "package.json"
      - "src/**/*"
      - "test/**/*"
      - "tsconfig.json"
      - "vitest.config.ts"
