language: "typescript"
layer: "library"
stack: "backend"

tasks:
  lint:
    command: "pnpm run lint"
    inputs:
      - "oxlint.config.ts"
      - "src/**/*"

  typecheck:
    command: "pnpm run typecheck"
    deps:
      - target: "^:typecheck"
        optional: true
    inputs:
      - "package.json"
      - "src/**/*"
      - "tsconfig.json"
