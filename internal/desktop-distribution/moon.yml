language: "typescript"
layer: "tool"
stack: "infrastructure"

workspace:
  inheritedTasks:
    include: []

tasks:
  assemble:
    command: "pnpm run assemble"
    deps:
      - "desktop-runtime:build"
      - "browser-session:build"
      - "cargo-workspace:build"
      - "dashboard:build"
      - "workspace-service:build"
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/apps/desktop-manager/Cargo.toml"
      - "/apps/dashboard/dist/**/*"
      - "/apps/browser-session/dist/browser-session.cjs"
      - "/apps/workspace-service/dist/workspace-service.mjs"
      - "/apps/workspace-service/dist/migrations/**/*"
      - "/target/release/job-boardwalk-desktop-manager*"
      - "/target/release/job-boardwalk-desktop-runtime*"
    outputs:
      - "/target/desktop-distribution"

  lint:
    command: "pnpm run lint"
    inputs:
      - "src/**/*"
      - "oxlint.config.ts"

  test:
    command: "pnpm run test"
    deps:
      - "~:typecheck"
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "package.json"
      - "vitest.config.ts"

  typecheck:
    command: "pnpm run typecheck"
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
