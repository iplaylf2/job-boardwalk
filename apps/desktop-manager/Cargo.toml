[package]
name = "job-boardwalk-desktop-manager"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
atomic-write-file = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
slint = { workspace = true, features = ["renderer-skia"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
slint = { workspace = true, features = ["renderer-software"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
