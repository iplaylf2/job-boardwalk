language: "typescript"
layer: "library"
stack: "infrastructure"

workspace:
  inheritedTasks:
    include: []

tasks:
  generate:
    command: "pnpm exec buf generate --template buf.gen.yaml"
    inputs:
      - "buf.gen.yaml"
      - "buf.yaml"
      - "**/*.proto"
    outputs:
      - "/apps/desktop-runtime/src/generated"
      - "/apps/desktop-manager/src/generated"
    options:
      cache: false
      runInCI: false

  lint:
    command: "pnpm exec buf lint"
    inputs:
      - "buf.yaml"
      - "**/*.proto"

  typecheck:
    command: "pnpm exec tsc --noEmit -p tsconfig.json"
    inputs:
      - "scripts/**/*.ts"
      - "tsconfig.json"

  test:
    command: "node scripts/check-generated.ts"
    deps:
      - "~:lint"
      - "~:typecheck"
    inputs:
      - "buf.gen.yaml"
      - "buf.yaml"
      - "scripts/**/*"
      - "**/*.proto"
      - "/apps/desktop-runtime/src/generated"
      - "/apps/desktop-manager/src/generated"
